name: Vibe Release Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run cinema tests
        run: npm run test:cinema

      - name: Release preflight
        run: npm run preflight

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vibe-sites-release
          path: dist/
          retention-days: 7
          if-no-files-found: error
