name: Vibe
options:
  bundleIdPrefix: com.vibe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
targets:
  Vibe:
    type: application
    platform: iOS
    sources:
      - path: Vibe
    info:
      path: Vibe/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.app
        INFOPLIST_FILE: Vibe/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Vibe/Vibe.entitlements
      properties:
        aps-environment: development
